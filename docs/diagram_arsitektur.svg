<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="320" fill="#ffffff" rx="8"/>

  <!-- Client Layer -->
  <g transform="translate(40, 20)">
    <rect width="720" height="65" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect width="720" height="22" rx="8" fill="#eff6ff"/>
    <text x="15" y="16" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#1e40af">CLIENT LAYER (SINGLE PAGE APPLICATION)</text>
    <text x="15" y="42" font-family="Times New Roman, serif" font-size="12" font-weight="bold" fill="#0f172a">React 18 + Vite 5 + Tailwind CSS + Lucide React (&lt;90KB gzip)</text>
    <text x="15" y="56" font-family="Times New Roman, serif" font-size="10" fill="#64748b">Hosted on Vercel Global Edge Network (https://kilastugas.vercel.app)</text>
  </g>

  <!-- Connection 1 -->
  <path d="M 400 85 L 400 120" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr2)"/>
  <rect x="330" y="94" width="140" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="106" font-family="Times New Roman, serif" font-size="9" font-weight="bold" fill="#0f172a">HTTPS REST API / JSON</text>

  <!-- Backend Engine Layer -->
  <g transform="translate(40, 125)">
    <rect width="720" height="65" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect width="720" height="22" rx="8" fill="#ecfdf5"/>
    <text x="15" y="16" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#065f46">BACKEND ENGINE LAYER (ASYNC CORE)</text>
    <text x="15" y="42" font-family="Times New Roman, serif" font-size="12" font-weight="bold" fill="#0f172a">Python 3.12 + FastAPI Web Framework + aiomysql Connection Pool</text>
    <text x="15" y="56" font-family="Times New Roman, serif" font-size="10" fill="#64748b">Deployed on Ubuntu VPS via Nginx Reverse Proxy + SSL Let's Encrypt (api-kilastugas.najmifaza.my.id)</text>
  </g>

  <!-- Connections down to AI & DB -->
  <path d="M 220 190 L 220 225" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr2)"/>
  <path d="M 580 190 L 580 225" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- AI Inference Layer -->
  <g transform="translate(40, 230)">
    <rect width="345" height="70" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect width="345" height="22" rx="8" fill="#f5f3ff"/>
    <text x="12" y="16" font-family="Times New Roman, serif" font-size="10.5" font-weight="bold" fill="#5b21b6">AI INFERENCE ENGINE</text>
    <text x="12" y="42" font-family="Times New Roman, serif" font-size="11.5" font-weight="bold" fill="#0f172a">9Router Gateway (Port 20128)</text>
    <text x="12" y="58" font-family="Times New Roman, serif" font-size="9.5" fill="#64748b">Model: ag/gemini-3.7-flash-medium (&lt;2s response)</text>
  </g>

  <!-- Persistence Layer -->
  <g transform="translate(415, 230)">
    <rect width="345" height="70" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect width="345" height="22" rx="8" fill="#fffbeb"/>
    <text x="12" y="16" font-family="Times New Roman, serif" font-size="10.5" font-weight="bold" fill="#92400e">DATA PERSISTENCE &amp; CACHE</text>
    <text x="12" y="42" font-family="Times New Roman, serif" font-size="11.5" font-weight="bold" fill="#0f172a">MariaDB 10.x Enterprise RDBMS</text>
    <text x="12" y="58" font-family="Times New Roman, serif" font-size="9.5" fill="#64748b">Relational DB (Tasks, Subtasks) + Smart AI Cache</text>
  </g>
</svg>
