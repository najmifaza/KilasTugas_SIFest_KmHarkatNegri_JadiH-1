<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#18181b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="280" fill="#ffffff" rx="8"/>

  <!-- Step 1: Input -->
  <g transform="translate(40, 20)">
    <rect width="210" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="24" rx="8" fill="#e2e8f0"/>
    <text x="12" y="16" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#334155">MASUKAN MAHASISWA</text>
    <text x="14" y="44" font-family="Times New Roman, serif" font-size="12" font-weight="bold" fill="#0f172a">Instruksi Tugas Panjang</text>
    <text x="14" y="62" font-family="Times New Roman, serif" font-size="10.5" fill="#64748b">• Silabus / Modul 5–15 Hlm</text>
    <text x="14" y="78" font-family="Times New Roman, serif" font-size="10.5" fill="#64748b">• Deadline &amp; Target Langkah</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 250 62 L 310 62" stroke="#18181b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Engine Core -->
  <g transform="translate(320, 15)">
    <rect width="440" height="95" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
    <rect width="440" height="26" rx="8" fill="#0f172a"/>
    <text x="15" y="18" font-family="Times New Roman, serif" font-size="11.5" font-weight="bold" fill="#ffffff">ENGINE KILASTUGAS (TRI-ENGINE SYSTEM)</text>
    
    <!-- Sub module 1 -->
    <rect x="15" y="38" width="125" height="46" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="22" y="55" font-family="Times New Roman, serif" font-size="10.5" font-weight="bold" fill="#0f172a">1. Smart Cache</text>
    <text x="22" y="72" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">&lt;20ms / 0 Token</text>

    <!-- Sub module 2 -->
    <rect x="155" y="38" width="130" height="46" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="162" y="55" font-family="Times New Roman, serif" font-size="10.5" font-weight="bold" fill="#0f172a">2. AI Breakdown</text>
    <text x="162" y="72" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">9Router (Gemini)</text>

    <!-- Sub module 3 -->
    <rect x="300" y="38" width="125" height="46" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="307" y="55" font-family="Times New Roman, serif" font-size="10.5" font-weight="bold" fill="#0f172a">3. Fallback Engine</text>
    <text x="307" y="72" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">Zero Downtime</text>
  </g>

  <!-- Arrow down from Engine to Pillars -->
  <path d="M 540 110 L 540 135 L 400 135 L 400 155" stroke="#18181b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Four Pillars Output -->
  <!-- Pillar 1 -->
  <g transform="translate(40, 165)">
    <rect width="165" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="165" height="22" rx="6" fill="#e2e8f0"/>
    <text x="10" y="15" font-family="Times New Roman, serif" font-size="10" font-weight="bold" fill="#1e293b">1. ACTIONABLE CHUNKING</text>
    <text x="10" y="44" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#0f172a">3–8 Aksi Konkret</text>
    <text x="10" y="62" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Estimasi 25–90 mnt</text>
    <text x="10" y="78" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Target harian teratur</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(225, 165)">
    <rect width="165" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="165" height="22" rx="6" fill="#e2e8f0"/>
    <text x="10" y="15" font-family="Times New Roman, serif" font-size="10" font-weight="bold" fill="#1e293b">2. VISUAL MICRO-PACING</text>
    <text x="10" y="44" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#0f172a">Pacing Bar &amp; Ring</text>
    <text x="10" y="62" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Status On Track</text>
    <text x="10" y="78" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Cegah panic H-1</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(410, 165)">
    <rect width="165" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="165" height="22" rx="6" fill="#e2e8f0"/>
    <text x="10" y="15" font-family="Times New Roman, serif" font-size="10" font-weight="bold" fill="#1e293b">3. DEEP FOCUS ENGINE</text>
    <text x="10" y="44" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#0f172a">Floating Pomodoro</text>
    <text x="10" y="62" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Siklus 25/5 menit</text>
    <text x="10" y="78" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Chime &amp; notifikasi</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(595, 165)">
    <rect width="165" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="165" height="22" rx="6" fill="#e2e8f0"/>
    <text x="10" y="15" font-family="Times New Roman, serif" font-size="10" font-weight="bold" fill="#1e293b">4. BLUEPRINT SHARING</text>
    <text x="10" y="44" font-family="Times New Roman, serif" font-size="11" font-weight="bold" fill="#0f172a">1-Click Import (/p/:id)</text>
    <text x="10" y="62" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Bagi rencana sekelas</text>
    <text x="10" y="78" font-family="Times New Roman, serif" font-size="9.5" fill="#475569">• Impor 1 detik</text>
  </g>
</svg>
